# 로컬 개발용 PostgreSQL을 실행한다.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hanbeonman
      POSTGRES_USER: hanbeonman
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanbeonman -d hanbeonman"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
